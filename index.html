<meta property="og:title" content="CAI Giovani del Lago">
<meta property="og:description" content="More mountains. Less scrolling. Escursioni ogni mese · 18–35 · Lago di Como">
<meta property="og:image" content="assets/grona.jpg">
<meta name="theme-color" content="#EEEEEC">
<link rel="icon" type="image/png" href="assets/logo.png">

<style>
@font-face{font-family:'Hauora Sans';src:url('assets/hauora-sans-latin-400-normal.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Hauora Sans';src:url('assets/hauora-sans-latin-500-normal.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Hauora Sans';src:url('assets/hauora-sans-latin-600-normal.woff2') format('woff2');font-weight:600;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;background:#EEEEEC;color:#141414;font-family:'Hauora Sans','Helvetica Neue',Arial,sans-serif;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
a{color:#141414}
:root{--mx:-9999px;--my:-9999px;--accent:#E8601C}

/* background */
.bg{position:fixed;inset:0;pointer-events:none;z-index:0}
.bg .layer{position:absolute;inset:-30px}
.bg svg{width:100%;height:100%;display:block}
.bg.base{opacity:.05}
.bg.reveal{opacity:.22;-webkit-mask-image:radial-gradient(240px circle at var(--mx) var(--my),#000 0%,rgba(0,0,0,.4) 45%,transparent 100%);mask-image:radial-gradient(240px circle at var(--mx) var(--my),#000 0%,rgba(0,0,0,.4) 45%,transparent 100%)}
.drift{animation:drift 80s ease-in-out infinite}
@keyframes drift{0%{transform:translate3d(0,0,0)}50%{transform:translate3d(-16px,7px,0)}100%{transform:translate3d(0,0,0)}}

.wrap{position:relative;z-index:1;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;padding:28px 4vw 36px}
.top,.bottom{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px 40px}
.top{font-size:14px;color:#5C5C5A}
.coords{display:flex;gap:18px;min-height:44px;align-items:center}
.social{display:flex;gap:28px}
.link{text-decoration:none;color:#141414;min-height:44px;display:flex;align-items:center}
.link:hover{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.plain{all:unset;box-sizing:border-box;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:10px}
.plain:hover{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.plain:focus-visible,.ev:focus-visible{outline:1px solid #141414;outline-offset:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 auto}

/* home */
.home{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:72px 0}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:56px 48px;width:100%;max-width:1080px}
.ev{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:14px;text-decoration:none;color:#141414}
.cover{position:relative;display:block;width:100%;aspect-ratio:4/5;overflow:hidden;background:#DDDDDA}
.cover img,.cover .tp{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cover .bw{filter:grayscale(1) contrast(1.05) brightness(1.02)}
@property --lv{syntax:'<percentage>';inherits:true;initial-value:0%}
.cover{--lv:0%;transition:--lv .75s cubic-bezier(.65,0,.35,1)}
.ev:hover .cover,.ev:focus-visible .cover{--lv:100%;transition:--lv 1s cubic-bezier(.65,0,.35,1)}
.cover .col{clip-path:inset(calc(100% - var(--lv)) 0 0 0)}
.cover .wl{position:absolute;left:0;right:0;bottom:var(--lv);height:1px;background:rgba(255,255,255,.9);box-shadow:0 0 0 .5px rgba(0,0,0,.15);opacity:0;pointer-events:none}
.ev:hover .wl,.ev:focus-visible .wl{animation:wl 1s cubic-bezier(.65,0,.35,1) forwards}
@keyframes wl{0%{opacity:0}8%{opacity:1}80%{opacity:1}100%{opacity:0}}
.label{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:15px;line-height:1.3}
.label .t{display:flex;align-items:center;gap:8px;font-weight:500;min-width:0}
.label .d{flex:0 0 auto;color:#5C5C5A}

/* typographic poster */
.tp{container-type:inline-size;background:#2F55E6;color:#EEEAE2;display:flex;flex-direction:column;justify-content:space-between;padding:9cqw}
.tp .a{font-size:6cqw;font-weight:500}
.tp .b{display:flex;flex-direction:column;gap:4cqw}
.tp .n{font-size:30cqw;font-weight:500;letter-spacing:-.04em;line-height:.85}
.tp .s{font-size:7cqw;font-weight:500;line-height:1.1}

/* detail */
.detail{flex:1 1 auto;width:100%;max-width:1200px;margin:0 auto;padding:72px 0 96px;display:flex;flex-direction:column;gap:96px}
.head{display:flex;flex-wrap:wrap;gap:48px 72px;align-items:flex-start}
.poster{flex:0 1 460px;min-width:260px}
.poster img{width:100%;height:auto;display:block;box-shadow:0 24px 60px -36px rgba(0,0,0,.4)}
.poster .tp{position:relative;aspect-ratio:4/5}
.info{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:28px;padding-top:8px}
.info .date{display:flex;align-items:center;gap:10px;font-size:17px;color:#5C5C5A}
.info h1{margin:0;font-size:clamp(40px,5.4vw,80px);font-weight:500;letter-spacing:-.035em;line-height:.98}
.info p{margin:0;max-width:560px;font-size:20px;line-height:1.45;color:#2E2E2C}
dl{margin:8px 0 0;border-bottom:1px solid rgba(20,20,20,.14)}
dl div{display:flex;justify-content:space-between;gap:24px;padding:14px 0;border-top:1px solid rgba(20,20,20,.14);font-size:16px}
dt{color:#5C5C5A}dd{margin:0;text-align:right}
.cta{display:flex;justify-content:space-between;align-items:center;min-height:60px;padding:0 24px;margin-top:4px;background:#141414;color:#F4F4F2;text-decoration:none;font-size:17px;font-weight:500}
.cta:hover{background:#000;color:#fff}
.cta .arr{display:inline-block;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.cta:hover .arr,.cta:focus-visible .arr{transform:translateX(10px)}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.photos figure{margin:0;aspect-ratio:4/5;overflow:hidden;background:#DDDDDA}
.photos img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s ease}
.photos figure:hover img{transform:scale(1.03)}
.empty{margin:0;padding:48px 0;border-top:1px solid rgba(20,20,20,.14);border-bottom:1px solid rgba(20,20,20,.14);font-size:17px;color:#5C5C5A;text-align:center}
.pn{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;font-size:16px}

/* bottom */
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:#141414}
.brand img{height:38px;width:auto;display:block}
.brand span{font-size:clamp(20px,2.2vw,32px);font-weight:500;letter-spacing:-.02em;line-height:1}
.cap{margin:0;flex:1 1 320px;text-align:center;font-size:15px;color:#5C5C5A}
.next{font-size:15px;text-decoration:none;color:#141414}

@media (hover:none){.cover .col{clip-path:none}.cover .wl{display:none}}
@media (prefers-reduced-motion:reduce){.drift{animation:none}.cover,.ev:hover .cover{transition:none}.cover .wl{display:none}}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){.photos{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  .wrap{padding:16px 20px 28px}
  .grid{grid-template-columns:minmax(0,1fr);row-gap:44px}
  .home{padding:32px 0 48px}
  .detail{padding:32px 0 64px;gap:56px}
  .poster{min-width:0;flex-basis:100%}
  .cap,.coords{display:none}
  .brand img{height:30px}
  .social{gap:20px}
}

/* merch */
.merch .poster{flex:0 1 520px}
.mockup{position:relative;aspect-ratio:4/5;background:#E3E3E0;display:flex;align-items:center;justify-content:center}
.mockup{perspective:1600px}
.flip{all:unset;cursor:pointer;position:relative;display:block;width:86%;aspect-ratio:4/5;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.65,0,.35,1)}
.flip.is-back{transform:rotateY(180deg)}
.flip:focus-visible{outline:1px solid #141414;outline-offset:6px}
.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.face svg{width:100%;height:auto;display:block}
.seg{display:flex;justify-content:center;gap:4px;margin-top:16px}
.seg button{all:unset;box-sizing:border-box;cursor:pointer;min-height:44px;padding:0 18px;display:flex;align-items:center;font-size:15px;color:#5C5C5A;border-radius:999px}
.seg button[aria-pressed="true"]{color:#141414;font-weight:600;background:rgba(20,20,20,.07)}
.seg button:hover{color:#141414}
.seg button:focus-visible{outline:1px solid #141414;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.flip{transition:none}}
.social .link{color:#5C5C5A;transition:color .25s ease}
.social .link:hover{color:#141414}
.social .link[aria-current="page"]{color:#141414;font-weight:600}
.mockup .fill{transition:fill .5s ease}
.opt{display:flex;flex-direction:column;gap:12px;border:0;margin:0;padding:0;min-width:0}
.opt legend,.opt label.lab{font-size:15px;color:#5C5C5A;padding:0;margin-bottom:12px}
.swatches,.sizes{display:flex;flex-wrap:wrap;gap:10px}
.sw{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:44px;padding:0 16px 0 8px;border:1px solid rgba(20,20,20,.18);border-radius:999px;font-size:15px}
.sw i{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sz{all:unset;box-sizing:border-box;cursor:pointer;min-width:52px;min-height:44px;padding:0 14px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(20,20,20,.18);border-radius:999px;font-size:15px}
.sw[aria-pressed="true"],.sz[aria-pressed="true"]{border-color:#141414;background:#141414;color:#F4F4F2}
.sw[aria-pressed="true"] i{box-shadow:0 0 0 2px #F4F4F2}
.sw:focus-visible,.sz:focus-visible,.nm:focus-visible{outline:1px solid #141414;outline-offset:3px}
.nm{width:100%;min-height:52px;padding:0 16px;border:1px solid rgba(20,20,20,.25);background:transparent;font:inherit;font-size:17px;color:#141414;border-radius:0}
.nm::placeholder{color:#8A8A87}
.info .hint{margin:0;font-size:14px;line-height:1.4;color:#5C5C5A}
.opts{display:flex;flex-direction:column;gap:32px;padding:8px 0}
</style>
</head>

<div class="bg reveal" aria-hidden="true"><div class="layer drift"><svg id="svg2" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" fill="none" stroke="#141414" stroke-width="1"></svg></div></div>

        + '<g class="flLines" fill="none" stroke-width="1.1">'
        + '<path d="M163 56 Q200 47 237 56"/><path d="M200 40 L200 200"/>'
        + '<path d="M110 440 L290 440"/><path d="M54 384 L98 394 M346 384 L302 394"/>'
        + '<path d="M112 212 Q112 160 124 118 M288 212 Q288 160 276 118" stroke-dasharray="3 4"/></g>'
        + '<rect class="flPull" x="196" y="196" width="8" height="18" rx="3"/>'
        + '<image class="flLogo" href="'+A+'logo.png" x="128" y="122" width="50" height="31"/>'
        + '<text class="flName" x="248" y="143" text-anchor="middle" font-family="Hauora Sans, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing=".5"></text>';
    } else {
      // back: collar seen from behind (no zip), large logo + wordmark across the upper back
      g += '<path class="flFill" d="M160 78 L163 46 Q200 40 237 46 L240 78 Q200 92 160 78 Z" stroke-width="1.4"/>'
        + '<g class="flLines" fill="none" stroke-width="1.1">'
        + '<path d="M163 58 Q200 52 237 58"/>'
        + '<path d="M110 440 L290 440"/><path d="M54 384 L98 394 M346 384 L302 394"/>'
        + '<path d="M112 212 Q112 160 124 118 M288 212 Q288 160 276 118" stroke-dasharray="3 4"/>'
        + '<path d="M161 76 Q200 68 239 76"/></g>'
        + '<image class="flLogo" href="'+A+'logo.png" x="150" y="128" width="100" height="62"/>'
        + '<text class="flThread" x="200" y="220" text-anchor="middle" font-family="Hauora Sans, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing=".2">CAI Giovani del Lago</text>'
        + '<text class="flThread" x="200" y="239" text-anchor="middle" font-family="Hauora Sans, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" letter-spacing="2.4" opacity=".75">SEZ. DERVIO</text>';
    }
    return g + '</g></svg>';
  }

  function paintFleece(){
    var c = COLORS.filter(function(x){ return x.id === merch.color; })[0];
    var stroke = c.dark ? 'rgba(255,255,255,.28)' : 'rgba(20,20,20,.45)';
    var thread = c.dark ? '#EEEAE2' : '#141414';
    var q = function(sel, fn){ view.querySelectorAll(sel).forEach(fn); };
    q('.flFill', function(el){ el.setAttribute('fill', c.fill); el.setAttribute('stroke', stroke); });
    q('.flLines', function(el){ el.setAttribute('stroke', stroke); });
    q('.flPull', function(el){ el.setAttribute('fill', c.dark ? '#BDBDBA' : '#6E6E6B'); });
    q('.flLogo', function(el){ el.style.filter = c.dark ? 'invert(1) brightness(1.1)' : 'none'; });
    q('.flThread', function(el){ el.setAttribute('fill', thread); });
    q('.flName', function(el){ el.textContent = merch.name ? merch.name : 'Il tuo nome'; el.setAttribute('fill', thread); el.setAttribute('opacity', merch.name ? '1' : '.4'); });
    var cta = document.getElementById('orderCta');
    if (cta){
      var msg = 'Ciao! Vorrei ordinare un pile CAI Giovani del Lago.\nColore: ' + c.name + '\nTaglia: ' + merch.size + '\nNome ricamato: ' + (merch.name || '—');
      cta.href = 'https://wa.me/' + ORDER_PHONE + '?text=' + encodeURIComponent(msg);
    }
  }

  function setSide(side){
    merch.side = side;
    var f = view.querySelector('.flip'); if (f) f.classList.toggle('is-back', side === 'back');
    view.querySelectorAll('.seg button').forEach(function(x){ x.setAttribute('aria-pressed', String(x.getAttribute('data-side') === side)); });
  }

  function renderMerch(){
    document.title = 'Merch — CAI Giovani del Lago';
    topLeft.innerHTML = '<a class="plain" href="#home" style="font-size:15px;color:#141414">← Tutte le gite</a>';
    cap.textContent = TAG;
    var sw = COLORS.map(function(c){ return '<button type="button" class="sw" data-color="'+c.id+'" aria-pressed="'+(c.id===merch.color)+'"><i style="background:'+c.fill+'"></i>'+c.name+'</button>'; }).join('');
    var sz = SIZES.map(function(s){ return '<button type="button" class="sz" data-size="'+s+'" aria-pressed="'+(s===merch.size)+'">'+s+'</button>'; }).join('');
    view.innerHTML = '<div class="detail merch">'
      + '<div class="head"><div class="poster">'
      + '<div class="mockup"><button type="button" class="flip'+(merch.side==='back'?' is-back':'')+'" aria-label="Gira il pile"><span class="face front">'+fleeceSVG('front')+'</span><span class="face back">'+fleeceSVG('back')+'</span></button></div>'
      + '<div class="seg" role="group" aria-label="Vista"><button type="button" data-side="front" aria-pressed="'+(merch.side!=='back')+'">Fronte</button><button type="button" data-side="back" aria-pressed="'+(merch.side==='back')+'">Retro</button></div>'
      + '</div>'
      + '<div class="info">'
      + '<h1>Il pile del gruppo</h1>'
      + '<p>Il nostro pile, con il logo CAI Giovani del Lago e il tuo nome ricamati sul petto.</p>'
      + '<div class="opts">'
      + '<fieldset class="opt"><legend>Colore</legend><div class="swatches">'+sw+'</div></fieldset>'
      + '<fieldset class="opt"><legend>Taglia</legend><div class="sizes">'+sz+'</div></fieldset>'
      + '<div class="opt"><label class="lab" for="nm">Nome da ricamare</label><input class="nm" id="nm" type="text" maxlength="14" autocomplete="off" placeholder="Max 14 caratteri" value="'+esc(merch.name)+'"></div>'
      + '</div>'
      + '<dl><div><dt>Prezzo e tempi</dt><dd>Nella community WhatsApp</dd></div></dl>'
      + '<a class="cta" id="orderCta" href="#" target="_blank" rel="noopener"><span>Ordina su WhatsApp</span><span class="arr" aria-hidden="true">→</span></a>'
      + '<p class="hint">Si apre WhatsApp con il messaggio già compilato: colore, taglia e nome.</p>'
      + '</div></div></div>';
    view.querySelectorAll('.sw').forEach(function(b){ b.addEventListener('click', function(){
      merch.color = b.getAttribute('data-color');
      view.querySelectorAll('.sw').forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); });
      paintFleece(); }); });
    view.querySelectorAll('.sz').forEach(function(b){ b.addEventListener('click', function(){
      merch.size = b.getAttribute('data-size');
      view.querySelectorAll('.sz').forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); });
      paintFleece(); }); });
    view.querySelectorAll('.seg button').forEach(function(b){ b.addEventListener('click', function(){ setSide(b.getAttribute('data-side')); }); });
    view.querySelector('.flip').addEventListener('click', function(){ setSide(merch.side === 'back' ? 'front' : 'back'); });
    document.getElementById('nm').addEventListener('input', function(ev){ merch.name = ev.target.value.trim(); paintFleece(); });
    paintFleece();
  }

  function route(){
    var m = location.hash.match(/^#gita-(\w+)/);
    var i = m ? EVENTS.findIndex(function(e){ return e.id === m[1]; }) : -1;
    var nm = document.getElementById('navMerch');
    if (location.hash === '#merch') nm.setAttribute('aria-current','page'); else nm.removeAttribute('aria-current');
    if (location.hash === '#merch') renderMerch();
    else if (i >= 0) renderDetail(i); else renderHome();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();

  /* contour background */
  function smooth(pts, closed){
    var f=function(n){return n.toFixed(1)}, mid=function(a,b){return[(a[0]+b[0])/2,(a[1]+b[1])/2]}, n=pts.length, d='', i, p, m;
    if(closed){ var m0=mid(pts[n-1],pts[0]); d='M'+f(m0[0])+' '+f(m0[1]);
      for(i=0;i<n;i++){p=pts[i];m=mid(p,pts[(i+1)%n]);d+='Q'+f(p[0])+' '+f(p[1])+' '+f(m[0])+' '+f(m[1]);} return d+'Z'; }
    d='M'+f(pts[0][0])+' '+f(pts[0][1]);
    for(i=1;i<n-1;i++){p=pts[i];m=mid(p,pts[i+1]);d+='Q'+f(p[0])+' '+f(p[1])+' '+f(m[0])+' '+f(m[1]);}
    return d+'L'+f(pts[n-1][0])+' '+f(pts[n-1][1]);
  }
  var lines='', rings='', ticks='', i, x, t;
  for(i=0;i<13;i++){ var base=80+i*64, pts=[];
    for(x=-40;x<=1480;x+=24) pts.push([x, base+36*Math.sin(x/290+i*.42)+15*Math.sin(x/113+i*1.3)+7*Math.sin(x/51+i*2.1)-(x-720)*.05*Math.sin(i*.5+.6)]);
    lines+=smooth(pts,false); }
  [[300,640,6,20],[1040,560,5,17],[560,250,3,13]].forEach(function(s,k){
    for(var r=1;r<=s[2];r++){ var R=r*s[3], pts=[];
      for(var q=0;q<64;q++){ var a=q/64*Math.PI*2, rr=R*(1+.16*Math.sin(3*a+k+r*.35)+.07*Math.sin(5*a+k*2)); pts.push([s[0]+rr*Math.cos(a)*1.3, s[1]+rr*Math.sin(a)]); }
      rings+=smooth(pts,true); } });
  var cx=1230, cy=170, R=96;
  for(t=0;t<120;t++){ var a=t/120*Math.PI*2, len=t%10===0?12:(t%5===0?7:4);
    ticks+='M'+(cx+R*Math.cos(a)).toFixed(1)+' '+(cy+R*Math.sin(a)).toFixed(1)+'L'+(cx+(R-len)*Math.cos(a)).toFixed(1)+' '+(cy+(R-len)*Math.sin(a)).toFixed(1); }
  var va=-19.4*Math.PI/180;
  var comp='M'+cx+' '+(cy-130)+'L'+cx+' '+(cy+130)+'M'+(cx-130)+' '+cy+'L'+(cx+130)+' '+cy
    +'M'+(cx-170*Math.cos(va)).toFixed(1)+' '+(cy-170*Math.sin(va)).toFixed(1)+'L'+(cx+170*Math.cos(va)).toFixed(1)+' '+(cy+170*Math.sin(va)).toFixed(1)
    +'M'+cx+' '+(cy-116)+'l-5 12h10z';
  var svgInner='<path d="'+lines+'"/><path d="'+rings+'"/><path d="'+ticks+'" stroke-width=".8"/><circle cx="1230" cy="170" r="96"/><circle cx="1230" cy="170" r="70" stroke-dasharray="2 4"/><path d="'+comp+'" stroke-width=".8"/>';
  document.getElementById('svg1').innerHTML = svgInner;
  document.getElementById('svg2').innerHTML = svgInner;

  var root = document.documentElement, raf = 0, px = .5, py = .5;
  window.addEventListener('mousemove', function(ev){
    root.style.setProperty('--mx', ev.clientX+'px'); root.style.setProperty('--my', ev.clientY+'px');
    px = ev.clientX / window.innerWidth; py = ev.clientY / window.innerHeight;
    if(!raf) raf = requestAnimationFrame(function(){ raf = 0;
      var la = document.getElementById('lat'), lo = document.getElementById('lon');
      if(la) la.textContent = (46.20 - .40*py).toFixed(4) + '° N';
      if(lo) lo.textContent = (9.05 + .40*px).toFixed(4) + '° E'; });
  }, { passive: true });
  document.addEventListener('mouseleave', function(){ root.style.setProperty('--mx','-9999px'); root.style.setProperty('--my','-9999px'); });
})();
</script>
</body>
